<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>3Dmol local module examples</title>
    <style>
      body { font-family: sans-serif; }
      .demo { display: inline-block; vertical-align: top; width: 48%; }
      .mol-container { width: 100%; height: 600px; position: relative; }
      button { margin: 0.25em; }
    </style>
  </head>
  <body>
    <div class="demo">
      <h2>4HHB: HEM sticks/spheres and surface</h2>
      <button id="surface-toggle" disabled>Hide surface</button>
      <span id="structure-status">Loading local BinaryCIF…</span>
      <div id="container-01" class="mol-container"></div>
    </div>
    <div class="demo">
      <h2>Multi-PDB animation</h2>
      <button id="animation-toggle" disabled>Play</button>
      <button id="next-frame" disabled>Next frame</button>
      <span id="animation-status">Loading local PDB…</span>
      <div id="container-02" class="mol-container"></div>
    </div>
    <script type="module">
      import * as $3Dmol from "../build/3Dmol.es6.js";

      const viewer = $3Dmol.createViewer(document.querySelector("#container-01"), {});
      const trajectoryViewer = $3Dmol.createViewer(document.querySelector("#container-02"), {});
      viewer.setBackgroundColor("white");
      trajectoryViewer.setBackgroundColor("white");
      window.lab = { viewer, trajectoryViewer, ready: false, surfaceId: null };

      const surfaceButton = document.querySelector("#surface-toggle");
      const animationButton = document.querySelector("#animation-toggle");
      const nextFrameButton = document.querySelector("#next-frame");
      let currentFrame = 0;
      let surfaceVisible = true;

      surfaceButton.addEventListener("click", () => {
        surfaceVisible = !surfaceVisible;
        viewer.setSurfaceMaterialStyle(window.lab.surfaceId, { opacity: surfaceVisible ? 0.35 : 0 });
        viewer.render();
        surfaceButton.textContent = surfaceVisible ? "Hide surface" : "Show surface";
        document.querySelector("#structure-status").textContent = `Surface ${surfaceVisible ? "visible" : "hidden"}; HEM sticks/spheres`;
      });
      animationButton.addEventListener("click", () => {
        if (trajectoryViewer.isAnimated()) {
          trajectoryViewer.stopAnimate();
          animationButton.textContent = "Play";
        } else {
          trajectoryViewer.animate({ loop: "forward", interval: 500 });
          animationButton.textContent = "Stop";
        }
      });
      nextFrameButton.addEventListener("click", async () => {
        trajectoryViewer.stopAnimate();
        animationButton.textContent = "Play";
        currentFrame = (currentFrame + 1) % window.lab.trajectoryModel.getNumFrames();
        await trajectoryViewer.setFrame(currentFrame);
        trajectoryViewer.render();
        document.querySelector("#animation-status").textContent = `Frame ${currentFrame + 1} / ${window.lab.trajectoryModel.getNumFrames()}`;
      });

      try {
        const [bcif, multiPdb] = await Promise.all([
          $3Dmol.getbin("../tests/auto/data/4hhb.bcif.gz"),
          $3Dmol.get("../tests/test_structs/multi.pdb"),
        ]);
        window.lab.model = viewer.addModel(bcif, "bcif.gz");
        viewer.setStyle({}, { cartoon: { color: "spectrum" } });
        viewer.setStyle({ resn: "HEM" }, {
          stick: { colorscheme: "magentaCarbon", radius: 0.2 },
          sphere: { scale: 0.35, colorscheme: "magentaCarbon" },
        });
        viewer.zoomTo();
        window.lab.surfaceId = await viewer.addSurface($3Dmol.SurfaceType.VDW, {
          opacity: 0.35,
          color: "white",
        }, { hetflag: false });
        viewer.render();
        surfaceButton.disabled = false;
        document.querySelector("#structure-status").textContent = "Surface visible; HEM sticks/spheres";

        window.lab.trajectoryModel = trajectoryViewer.addModelsAsFrames(multiPdb, "pdb");
        trajectoryViewer.setStyle({}, { cartoon: { colorscheme: "chain" }, stick: { colorscheme: "greenCarbon" } });
        trajectoryViewer.zoomTo();
        trajectoryViewer.render();
        animationButton.disabled = false;
        nextFrameButton.disabled = false;
        document.querySelector("#animation-status").textContent = `Frame 1 / ${window.lab.trajectoryModel.getNumFrames()}`;
        window.lab.ready = true;
        console.log("Local 3Dmol demos ready", {
          hemAtoms: window.lab.model.selectedAtoms({ resn: "HEM" }).length,
          frames: window.lab.trajectoryModel.getNumFrames(),
        });
      } catch (error) {
        document.querySelector("#structure-status").textContent = `Error: ${error.message}`;
        document.querySelector("#animation-status").textContent = "Load failed";
        console.error("Failed to load local 3Dmol demos", error);
      }
    </script>
  </body>
</html>
